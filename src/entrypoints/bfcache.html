<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>devkit · back/forward cache test</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #14171f;
        --fg-3: #646b7a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111318;
          --fg: #e7e9ee;
          --fg-3: #8a91a0;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font: 14px / 1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        max-width: 42ch;
        padding: 24px;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 15px;
        font-weight: 650;
      }
      p {
        margin: 0;
        color: var(--fg-3);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Testing the back/forward cache</h1>
      <p>devkit left the page for a moment and is going back to it. If you stay here, use the browser's Back button.</p>
    </main>
  </body>
</html>
